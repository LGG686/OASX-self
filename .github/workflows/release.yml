name: Release

# 手动触发：Actions → Release → Run workflow，在本分支上运行，通过 build_ref 指定要构建的分支
# （留空则构建当前分支）。产物只上传 artifact；推 v* tag 时才走正式发布流程。
on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "要构建的分支或 tag（留空 = 当前选中的分支）"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.1"
  DART_VERSION: "3.9.0"
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"

jobs:
  warm_flutter_cache:
    name: Warm Flutter Cache (Windows)
    if: ${{ startsWith(github.ref, 'refs/heads/') }}
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref || github.ref }}

      - name: Setup Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Warm pub cache
        if: steps.flutter-action.outputs.PUB-CACHE-HIT != 'true'
        shell: bash
        run: flutter pub get

      - name: Report Flutter cache status
        shell: bash
        run: |
          echo "Flutter cache key: ${{ steps.flutter-action.outputs.CACHE-KEY }}"
          echo "Flutter cache hit: ${{ steps.flutter-action.outputs.CACHE-HIT }}"
          echo "Pub cache key: ${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}"
          echo "Pub cache hit: ${{ steps.flutter-action.outputs.PUB-CACHE-HIT }}"

  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      label: ${{ steps.meta.outputs.label }}
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          pub_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # tag 触发：版本号取自 tag（v1.0.1 -> 1.0.1），走正式发布流程
            tag_name="${GITHUB_REF_NAME}"
            version_core="${tag_name#v}"
            build_name="${version_core%%+*}"
            build_number="$(python -c 'import pathlib,re; print(re.search(r"^version:.*\+(\d+)", pathlib.Path("pubspec.yaml").read_text(), re.M).group(1))')"
            prerelease="false"

            if [[ "$tag_name" == *-* ]]; then
              build_number="${GITHUB_RUN_NUMBER}"
              prerelease="true"
            fi

            label="$tag_name"
          else
            # 分支手动触发：版本号取自 pubspec，只构建产物、不创建 Release
            build_name="${pub_version%%+*}"
            build_number="${GITHUB_RUN_NUMBER}"
            tag_name=""
            prerelease="false"
            # 产物名带上实际被构建的分支，避免不同分支的包混在同一个 workflow 里分不清
            built_ref="${{ inputs.build_ref }}"
            built_ref="${built_ref:-$GITHUB_REF_NAME}"
            built_ref="${built_ref//\//-}"
            label="${build_name}_${built_ref}_r${GITHUB_RUN_NUMBER}"
          fi

          {
            echo "tag_name=$tag_name"
            echo "label=$label"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Extract latest changelog
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: python ./script/extract_changelog.py

      - name: Create release if needed
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG_NAME" \
              --notes-file CHANGELATEST.md \
              --draft \
              --prerelease
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG_NAME" \
              --notes-file CHANGELATEST.md \
              --draft
          fi

  build_windows:
    name: Build Windows
    runs-on: windows-2022
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify SDK versions
        shell: pwsh
        run: |
          $flutterOutput = ((flutter --version) | Out-String).Trim()
          $flutterOutput
          if ($flutterOutput -notmatch "Flutter $env:FLUTTER_VERSION") {
            throw "Expected Flutter $env:FLUTTER_VERSION"
          }

          $dartOutput = ((dart --version 2>&1) | Out-String).Trim()
          $dartOutput
          if ($dartOutput -notmatch "Dart SDK version: $env:DART_VERSION") {
            throw "Expected Dart $env:DART_VERSION"
          }

      - name: Restore Windows release file
        env:
          WINDOWS_RELEASE_PATH: ${{ secrets.WINDOWS_PATH_KEY }}
          WINDOWS_RELEASE_CONTENT: ${{ secrets.WINDOWS_PATH_VALUES }}
        shell: pwsh
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_RELEASE_PATH) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_RELEASE_CONTENT)
          ) {
            Write-Host 'Skip restoring Windows release file because required secrets are empty.'
            exit 0
          }

          $path = $env:WINDOWS_RELEASE_PATH
          $directory = Split-Path -Path $path -Parent
          if (![string]::IsNullOrWhiteSpace($directory)) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }
          Set-Content -Path $path -Value $env:WINDOWS_RELEASE_CONTENT -Encoding UTF8

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Test desktop and error report integration
        # Validate the user-facing changes before packaging a release.
        shell: pwsh
        run: flutter test --concurrency=1 test/desktop_workbench_test.dart test/illustration_test.dart test/log_api_regression_test.dart test/error_report_test.dart test/error_analysis_widget_test.dart test/script_analysis_models_test.dart

      - name: Compile Windows app
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name "${{ needs.version.outputs.build_name }}" `
            --build-number "${{ needs.version.outputs.build_number }}"

      - name: Install UPX
        shell: pwsh
        run: choco install upx -y

      - name: Compress Windows binaries
        shell: pwsh
        run: |
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          Push-Location $releasePath
          try {
            Get-ChildItem -Filter *.exe | ForEach-Object { & upx --best --lzma $_.Name }
            Get-ChildItem -Filter *.dll | ForEach-Object { & upx --best --lzma $_.Name }
          } finally {
            Pop-Location
          }

      - name: Package Windows release
        id: package
        shell: pwsh
        run: |
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          $assetName = "oasx_${{ needs.version.outputs.label }}_windows.zip"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $assetName
          if (Test-Path $assetPath) {
            Remove-Item $assetPath -Force
          }
          Compress-Archive -Path (Join-Path $releasePath '*') -DestinationPath $assetPath
          # Ship an empty pictures directory, without sample images/placeholders.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($assetPath, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            if ($null -eq $archive.GetEntry('pictures/')) {
              $archive.CreateEntry('pictures/') | Out-Null
            }
          } finally {
            $archive.Dispose()
          }
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload Windows asset to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ needs.version.outputs.tag_name }}" `
            "${{ steps.package.outputs.asset_path }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify SDK versions
        shell: bash
        run: |
          flutter_output="$(flutter --version)"
          echo "$flutter_output"
          [[ "$flutter_output" == *"Flutter ${FLUTTER_VERSION}"* ]]
          dart_output="$(dart --version 2>&1)"
          echo "$dart_output"
          [[ "$dart_output" == *"Dart SDK version: ${DART_VERSION}"* ]]
          java_output="$(java -version 2>&1 | head -n 1)"
          echo "$java_output"
          [[ "$java_output" == *"\"${JAVA_VERSION}"* ]]

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      - name: Build split-per-abi APKs
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --no-pub \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ needs.version.outputs.build_name }}" \
            --build-number "${{ needs.version.outputs.build_number }}"

      - name: Prepare Android release assets
        id: prepare_android_assets
        env:
          LABEL: ${{ needs.version.outputs.label }}
        shell: bash
        run: |
          release_dir="build/app/outputs/github-release"
          mkdir -p "$release_dir"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" \
            "${release_dir}/oasx_${LABEL}_armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
            "${release_dir}/oasx_${LABEL}_arm64-v8a.apk"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ steps.prepare_android_assets.outputs.release_dir }}
          if-no-files-found: error

      - name: Upload Android assets to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          for abi in armeabi-v7a arm64-v8a; do
            gh release upload "$TAG_NAME" \
              "${{ steps.prepare_android_assets.outputs.release_dir }}/oasx_${TAG_NAME}_${abi}.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done

  publish_release:
    name: Publish verified release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs: [version, build_windows, build_android]
    steps:
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          tag = os.environ['TAG_NAME']
          expected = {f'oasx_{tag}_windows.zip', f'oasx_{tag}_armeabi-v7a.apk', f'oasx_{tag}_arm64-v8a.apk'}
          assets = json.loads(Path('release-assets.json').read_text())['assets']
          actual = {asset['name'] for asset in assets if asset['size'] > 0}
          missing = expected - actual
          if missing:
              raise SystemExit(f'Missing release assets: {sorted(missing)}')
          print('Verified all Windows and Android release assets')
          PY
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
