name: Release

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "电脑版 (Windows exe)"
        type: boolean
        default: true
      build_android:
        description: "手机版 (Android APK)"
        type: boolean
        default: true
      build_web:
        description: "Web 版（发布 oasx-web-latest，供 App 网页控制台更新）"
        type: boolean
        default: false
      release_tag:
        description: "目标 release tag（如 v1.0.2；留空 = 只出 artifact，不建 release）"
        required: false
        default: ""
      auto_publish:
        description: "构建成功后自动发布 release（取消 draft 并标记 latest；tag push 恒为发布）"
        type: boolean
        default: false
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.1"
  DART_VERSION: "3.9.0"
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"

jobs:
  warm_flutter_cache:
    name: Warm Flutter Cache (Windows)
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Warm pub cache
        if: steps.flutter-action.outputs.PUB-CACHE-HIT != 'true'
        shell: bash
        run: flutter pub get

      - name: Report Flutter cache status
        shell: bash
        run: |
          echo "Flutter cache key: ${{ steps.flutter-action.outputs.CACHE-KEY }}"
          echo "Flutter cache hit: ${{ steps.flutter-action.outputs.CACHE-HIT }}"
          echo "Pub cache key: ${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}"
          echo "Pub cache hit: ${{ steps.flutter-action.outputs.PUB-CACHE-HIT }}"

  create_release:
    name: Create Release
    # tag push 或手动构建填了 release_tag 时才建 release；否则只出 artifact。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="${{ inputs.release_tag }}"
          fi
          version_core="${tag_name#v}"
          build_name="${version_core%%+*}"
          build_number="$(python -c 'import pathlib,re; print(re.search(r"^version:.*\+(\d+)", pathlib.Path("pubspec.yaml").read_text(), re.M).group(1))')"
          prerelease="false"

          if [[ "$tag_name" == *-* ]]; then
            build_number="${GITHUB_RUN_NUMBER}"
            prerelease="true"
          fi

          {
            echo "tag_name=$tag_name"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "version=$build_name+$build_number"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Extract latest changelog
        shell: bash
        run: python ./script/extract_changelog.py

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Release $TAG_NAME" \
              --notes-file CHANGELATEST.md \
              --draft \
              --prerelease
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Release $TAG_NAME" \
              --notes-file CHANGELATEST.md \
              --draft
          fi

  build_windows:
    name: Build Windows
    # tag push 恒建；手动构建按 input 开关。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_windows == true }}
    runs-on: windows-2022
    needs: create_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify SDK versions
        shell: pwsh
        run: |
          $flutterOutput = ((flutter --version) | Out-String).Trim()
          $flutterOutput
          if ($flutterOutput -notmatch "Flutter $env:FLUTTER_VERSION") {
            throw "Expected Flutter $env:FLUTTER_VERSION"
          }

          $dartOutput = ((dart --version 2>&1) | Out-String).Trim()
          $dartOutput
          if ($dartOutput -notmatch "Dart SDK version: $env:DART_VERSION") {
            throw "Expected Dart $env:DART_VERSION"
          }

      - name: Restore Windows release file
        env:
          WINDOWS_RELEASE_PATH: ${{ secrets.WINDOWS_PATH_KEY }}
          WINDOWS_RELEASE_CONTENT: ${{ secrets.WINDOWS_PATH_VALUES }}
        shell: pwsh
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_RELEASE_PATH) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_RELEASE_CONTENT)
          ) {
            Write-Host 'Skip restoring Windows release file because required secrets are empty.'
            exit 0
          }

          $path = $env:WINDOWS_RELEASE_PATH
          $directory = Split-Path -Path $path -Parent
          if (![string]::IsNullOrWhiteSpace($directory)) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }
          Set-Content -Path $path -Value $env:WINDOWS_RELEASE_CONTENT -Encoding UTF8

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Test desktop and error report integration
        # Validate the user-facing changes before packaging a release.
        shell: pwsh
        run: flutter test --concurrency=1 test/desktop_workbench_test.dart test/illustration_test.dart test/log_api_regression_test.dart test/error_report_test.dart test/error_analysis_widget_test.dart test/script_analysis_models_test.dart

      - name: Compile Windows app
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name "${{ needs.create_release.outputs.build_name }}" `
            --build-number "${{ needs.create_release.outputs.build_number }}"

      - name: Install UPX
        shell: pwsh
        run: choco install upx -y

      - name: Compress Windows binaries
        shell: pwsh
        run: |
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          Push-Location $releasePath
          try {
            Get-ChildItem -Filter *.exe | ForEach-Object { & upx --best --lzma $_.Name }
            Get-ChildItem -Filter *.dll | ForEach-Object { & upx --best --lzma $_.Name }
          } finally {
            Pop-Location
          }

      - name: Package Windows release
        id: package
        shell: pwsh
        run: |
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          $assetName = "oasx_${{ needs.create_release.outputs.tag_name }}_windows.zip"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $assetName
          if (Test-Path $assetPath) {
            Remove-Item $assetPath -Force
          }
          Compress-Archive -Path (Join-Path $releasePath '*') -DestinationPath $assetPath
          # Ship an empty pictures directory, without sample images/placeholders.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($assetPath, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            if ($null -eq $archive.GetEntry('pictures/')) {
              $archive.CreateEntry('pictures/') | Out-Null
            }
          } finally {
            $archive.Dispose()
          }
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact (no release build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: oasx-windows
          path: ${{ steps.package.outputs.asset_path }}
          retention-days: 14

      - name: Upload Windows asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ needs.create_release.outputs.tag_name }}" `
            "${{ steps.package.outputs.asset_path }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

  build_android:
    name: Build Android
    # tag push 恒建；手动构建按 input 开关。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_android == true }}
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify SDK versions
        shell: bash
        run: |
          flutter_output="$(flutter --version)"
          echo "$flutter_output"
          [[ "$flutter_output" == *"Flutter ${FLUTTER_VERSION}"* ]]
          dart_output="$(dart --version 2>&1)"
          echo "$dart_output"
          [[ "$dart_output" == *"Dart SDK version: ${DART_VERSION}"* ]]
          java_output="$(java -version 2>&1 | head -n 1)"
          echo "$java_output"
          [[ "$java_output" == *"\"${JAVA_VERSION}"* ]]

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      - name: Build split-per-abi APKs
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --no-pub \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ needs.create_release.outputs.build_name }}" \
            --build-number "${{ needs.create_release.outputs.build_number }}"

      - name: Prepare Android release assets
        id: prepare_android_assets
        env:
          TAG_NAME: ${{ needs.create_release.outputs.tag_name }}
        shell: bash
        run: |
          release_dir="build/app/outputs/github-release"
          mkdir -p "$release_dir"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" \
            "${release_dir}/oasx_${TAG_NAME}_armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
            "${release_dir}/oasx_${TAG_NAME}_arm64-v8a.apk"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifacts (no release build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: oasx-android-apks
          path: ${{ steps.prepare_android_assets.outputs.release_dir }}/*.apk
          retention-days: 14

      - name: Upload Android assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.create_release.outputs.tag_name }}
        shell: bash
        run: |
          for abi in armeabi-v7a arm64-v8a; do
            gh release upload "$TAG_NAME" \
              "${{ steps.prepare_android_assets.outputs.release_dir }}/oasx_${TAG_NAME}_${abi}.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done

  build_web:
    name: Build Web (oasx-web-latest)
    # Web 包与 release tag 无关：单独构建并滚动覆盖 oasx-web-latest，
    # OAS 容器与 App 网页控制台更新通道都从这里拉取。
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_web == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Pub get
        run: flutter pub get

      # 挂载路径是 /gui/，base-href 必须一致，静态资源才能按相对路径命中
      - name: Build web
        run: flutter build web --release --base-href /gui/

      - name: Pack bundle
        run: |
          cd build/web
          zip -qr ../../oasx-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: oasx-web
          path: oasx-web.zip
          retention-days: 14

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          if ! gh release view oasx-web-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create oasx-web-latest --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OASX Web" \
              --notes "滚动更新的网页版构建，OAS 容器构建时从此处拉取。"
          fi
          gh release upload oasx-web-latest oasx-web.zip --repo "$GITHUB_REPOSITORY" --clobber

  publish_release:
    name: Publish verified release
    # tag push 恒发布；手动构建仅在勾选 auto_publish 时发布。
    if: >-
      ${{ !cancelled() &&
          needs.create_release.result == 'success' &&
          (needs.build_windows.result == 'success' || needs.build_windows.result == 'skipped') &&
          (needs.build_android.result == 'success' || needs.build_android.result == 'skipped') &&
          (needs.build_windows.result == 'success' || needs.build_android.result == 'success') &&
          (startsWith(github.ref, 'refs/tags/v') || inputs.auto_publish == true) }}
    runs-on: ubuntu-latest
    needs: [create_release, build_windows, build_android]
    steps:
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.create_release.outputs.tag_name }}
          BUILD_WINDOWS: ${{ needs.build_windows.result }}
          BUILD_ANDROID: ${{ needs.build_android.result }}
        shell: bash
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          tag = os.environ['TAG_NAME']
          expected = set()
          if os.environ['BUILD_WINDOWS'] == 'success':
              expected.add(f'oasx_{tag}_windows.zip')
          if os.environ['BUILD_ANDROID'] == 'success':
              expected.update({f'oasx_{tag}_armeabi-v7a.apk', f'oasx_{tag}_arm64-v8a.apk'})
          assets = json.loads(Path('release-assets.json').read_text())['assets']
          actual = {asset['name'] for asset in assets if asset['size'] > 0}
          missing = expected - actual
          if missing:
              raise SystemExit(f'Missing release assets: {sorted(missing)}')
          print('Verified release assets:', sorted(expected))
          PY
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
